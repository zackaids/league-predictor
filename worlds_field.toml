# Projected Worlds field.
#
# These are ASSUMPTIONS, not results. The Worlds field is not confirmed, so the
# simulation builds a projected field from the top calibrated teams per league.
# Update this file as qualification firms up -- no code change needed.

# Total teams in the field. Must equal the sum of `slots`.
size = 16

# Teams locked in regardless of their calibrated rank, as {team, reason} pairs.
#
# Hanwha Life beat Bilibili Gaming in the MSI 2026 final on 2026-07-12, so the
# qualification is real and verifiable in the data (league code `MSI`,
# 2026-06-28 to 2026-07-12).
guaranteed = [{ team = "Hanwha Life Esports", reason = "won MSI 2026" }]

# Projected slots per qualifying league.
[slots]
LCK = 4
LPL = 4
LEC = 3
LCP = 3
LCS = 2

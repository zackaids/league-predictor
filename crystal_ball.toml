# Worlds 2026 Crystal Ball (the official Pick'Em bonus). Locks right before the
# first Play-In match on 2026-10-15 and never reopens.
#
# Points are PER QUESTION (every answer to a question pays the same), copied from
# the Pick'Em UI -- so the best pick is the most probable answer and the expected
# points are probability x points.
[points]
presence       = 50    # champion with the highest presence (picked or banned)
champ_wr       = 50    # champion with the highest win rate (min 5 games)
champ_deaths   = 50    # champion with the most deaths per game (min 5 games)
kda            = 50    # pro with the highest average KDA
damage         = 50    # pro with the highest average damage per game
kp             = 50    # pro with the highest average kill participation
peyz_guma      = 100   # Peyz vs Gumayusi: more total kills
faker_700      = 100   # Faker reaches 700 career Worlds kills
teemo          = 100   # Teemo picked at least once
unique_champs  = 50    # how many unique champions are picked
length_32      = 50    # more games before or after 32 minutes
kills_15       = 50    # any pro with >= 15 kills in a game
cs_450         = 50    # any pro with >= 450 CS in a game
mvp_role       = 50    # role of the Finals MVP
regions_ko     = 50    # distinct regions among the 8 knockout teams
lcs_ko         = 50    # an LCS team reaches knockouts
hle_t1         = 50    # which of HLE / T1 places higher
shortest_game  = 50    # team that wins the shortest game

[teams]
hle = "Hanwha Life Esports"
t1  = "T1"
lcs = "LCS"             # home_league code

[players]
a = "Peyz"
b = "Gumayusi"
faker = "Faker"
faker_career_kills = 616     # entering Worlds 2026 (Crystal Ball text)
faker_target = 700

# Does the Play-In count toward the stats? The rules are silent; "across all
# drafts" suggests yes. Override with --no-playin.
[rules]
include_playin = true
ko_teams = 8

# --- model knobs (see crystal_ball.py) -------------------------------------
[model]
# Added to every simulated game length (minutes). Fitted by `--backtest`: the
# pool is domestic games, which run shorter than Worlds'. Suggested offsets were
# +0.4 (2023), +1.5 (2024), +0.9 (2025); 2022 was -1.8, an unusually fast Worlds.
length_offset_min = 0.9
# Year-to-year spread of that offset (each simulated Worlds draws its own): the
# suggested offsets ranged -1.8 .. +1.5 over 2022-25.
length_offset_sd_min = 1.0

# Chance that the leader is a one-game substitute, which the roster-based
# simulation cannot produce: Worlds 2017-25 main events had a one-game winner
# of KP 3/9 (Haru, Apex, Atlen), damage 1/9 (XuHao), KDA 0/9.
# Unique champions: the pool simulation over-counts (model v actual: 93 v 89 in
# 2023, 96 v 95 in 2024, 104 v 95 in 2025); actual/model averages 0.95.
unique_scale = 0.95
# Year-level error left after scaling: model v actual was -1, +4, -4 (2023-25).
unique_sd = 4.0

# Highest win rate: a lottery (see wr_lottery). Champions expected to reach 5 games
# are those whose expected presence is at least this.
wr_min_presence = 0.25

# Any 450+ CS game happened at 8 of 9 Worlds (2020 had none): never say "No" below this.
cs_450_no_floor = 0.07

[model.other_mass]
kp     = 0.33
damage = 0.11
kda    = 0.0

# Teemo: picks per game in the best-comparable data (Jeffreys prior of 0.5 picks).
[model.teemo]
worlds_picks = 1        # Worlds 2017-25 main events (Kiwoom DRX, 2022)
worlds_games = 1023
top_picks    = 0        # 2026 LCK/LPL/LEC/LCS/LCP/CBLOL/MSI/FST/EWC
top_games    = 2765

# Finals MVP role, Worlds 2014-2025 (2012-13 not recorded; 2011 unclear).
[model.mvp_role]
top = 3     # MaRin 2015, Kingen 2022, Zeus 2023
jng = 3     # Ning 2018, Tian 2019, Canyon 2020
mid = 3     # Faker 2016 + 2024, Scout 2021
bot = 2     # Ruler 2017, Gumayusi 2025
sup = 1     # Mata 2014

# 15-kill games: the simulation predicts ~2 per Worlds against 0 actual in each
# of 2023-25, so use the observed Worlds rate: 5 such games in the 1,023 games of
# the 2017-25 main events (2017, 2018, 2020, 2021, 2022).
[model.kills_15]
worlds_hits = 5
worlds_games = 1023

# Expected Worlds presence of a champion = intercept + a*A + c*C, fitted on Worlds
# 2021-25 (residual sd ~0.19). A = presence on the latest 150+ game patch and newer
# (all leagues) with the newest 40+ game patch counted `newest_weight` times, C = the
# event teams' own pre-event games. Leave-one-year-out the top pick hit about 1 year
# in 5, as its probabilities say; weighting the newest patch x8 scored best (mean log
# P of the real leader -3.21 vs -3.30 unweighted, mostly from 2024, the one year with
# a distinct small newest patch), and it is what puts Vi ahead of Nocturne in 2026.
[model.meta_presence]
intercept = 0.04
a = 0.79
c = 0.08
sigma = 0.19
newest_weight = 8

# Most deaths per game: champions with 30+ pre-event major-league games, ranked by
# shrunk deaths/game (recency half-life in days, shrink = pseudo-games toward the
# mean), blended with the newest 150+ game patch across all leagues; softmax with
# temperature tau. Backtest on Worlds 2020-25: actual leader ranked 1,2,3,5,2,1
# (mean log-likelihood -1.71 vs -3.15 for the pool simulation; best variant -1.60).
[model.deaths]
half_life = 45
shrink = 40
newest_weight = 0.5
tau = 0.15
min_games = 30
max_top = 0.5     # never claim more than the predictor's backtest hit rate
